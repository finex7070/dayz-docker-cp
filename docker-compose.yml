services:
  dayz:
    build:
      context: .
      args:                     # must match PUID/PGID in .env
        STEAM_UID: ${PUID:-1000}
        STEAM_GID: ${PGID:-1000}
    # Published by the GitHub Action on every push to main. `docker compose
    # pull` fetches it; `docker compose build` overwrites it with a local
    # build under the same name.
    image: ghcr.io/finex7070/dayz-docker-cp:latest
    container_name: dayz

    env_file:
      - .env

    ports:
      - "${PANEL_PORT:-8080}:${PANEL_PORT:-8080}/tcp"                # panel (HTTP)
      # SERVER_PORT carries the whole range - game, reserved and BattlEye sit on
      # N, N+1 and N+2 - because Compose cannot add and publishes what it reads.
      # entrypoint.sh rejects anything wider than three ports.
      - "${SERVER_PORT:-2302-2304}:${SERVER_PORT:-2302-2304}/udp"     # game
      - "${RCON_PORT:-2305}:${RCON_PORT:-2305}/udp"                  # BattlEye RCON
      - "${STEAM_QUERY_PORT:-27016}:${STEAM_QUERY_PORT:-27016}/udp"  # Steam query

    volumes:
      - ./data:/data            # or a named volume: dayz-data:/data

    stop_grace_period: 60s      # the panel shuts the server down first
    restart: unless-stopped
    tty: true                   # SteamCMD buffers its progress output otherwise

