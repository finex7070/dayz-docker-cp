// ---------------------------------------------------------------------------
// Default server configuration
//
// Copied to /data/server/serverDZ.cfg on first start, unless a file
// already exists there. Existing files are NEVER overwritten - from then on,
// edit the config through the panel's config editor.
// ---------------------------------------------------------------------------

hostname = "DayZ Server (Docker)";   // name shown in the server browser
password = "";                        // join password ("" = open)
passwordAdmin = "";                   // admin password - make sure to set this!

enableWhitelist = 0;                  // 1 = whitelisted players only
maxPlayers = 60;

verifySignatures = 2;                 // 2 = signed mods only (recommended)
forceSameBuild = 1;                   // client build must match the server

disableVoN = 0;                       // 0 = voice chat enabled
vonCodecQuality = 20;

disable3rdPerson = 0;                 // 1 = first person only
disableCrosshair = 0;
disablePersonalLight = 1;

lightingConfig = 0;                   // 0 = bright nights, 1 = dark nights

serverTime = "SystemTime";            // start time; e.g. "2024/06/01/12/00"
serverTimeAcceleration = 12;          // daytime acceleration
serverNightTimeAcceleration = 1;
serverTimePersistent = 0;             // 1 = time survives restarts

guaranteedUpdates = 1;

loginQueueConcurrentPlayers = 5;
loginQueueMaxPlayers = 500;

instanceId = 1;                       // persistence folder; increment on wipe
storageAutoFix = 1;                   // auto repair corrupted persistence

respawnTime = 5;
timeStampFormat = "Short";
logAverageFps = 30;
logMemory = 30;
logPlayers = 30;
logFile = "server_console.log";

// Steam query port - must match the mapped UDP port (env: STEAM_QUERY_PORT)
steamQueryPort = 27016;

class Missions
{
    class DayZ
    {
        template = "dayzOffline.chernarusplus";   // Chernarus; Livonia: dayzOffline.enoch
    };
};
